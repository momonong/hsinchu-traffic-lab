[project]
name = "hsinchu-traffic-lab"
version = "0.2.0"
description = "Data collection and exploratory analysis for Hsinchu traffic research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<2.4",
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
  "pyarrow>=16,<24",
  "scikit-learn>=1.5,<2",
]

[tool.uv]
package = false

[project.optional-dependencies]
gpu = ["torch==2.7.0"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
